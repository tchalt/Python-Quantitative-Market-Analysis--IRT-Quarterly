# Global Quarterly Quantitative Analysis Model - Configuration
# Tickers, Benchmarks, and Risk-Free Rates

# --- Global Market (Americas, Europe) ---
global:
  americas:
    indices: ["^GSPC", "^NDX"]
    commodities: ["GC=F", "SI=F", "HG=F"]
    commodities_fallback: []
    oil: ["BZ=F"] # Brent
    sources:
      "^GSPC": "yfinance"
      "^NDX": "yfinance"
      "GC=F": "yfinance"
      "SI=F": "yfinance"
      "HG=F": "yfinance"
      "BZ=F": "yfinance"
    fallbacks:
      "^GSPC": []
      "^NDX": []
      "GC=F": []
      "SI=F": []
      "HG=F": []
      "BZ=F": []
  europe:
    indices: ["^STOXX50E", "^GDAXI"] # Euro Stoxx 50, DAX
    shipping: ["BDI.INDEX"]
    banks: ["ATEA.NO"]
    sources:
      "^STOXX50E": "yfinance"
      "^GDAXI": "yfinance"
    fallbacks:
      "^STOXX50E": []
      "^GDAXI": []
  risk_free_rate:
    symbol: "^TNX.US"
    default_value: 0.045
  benchmark:
    symbol: "^GSPC"

# --- Domestic Market (China A-Shares) ---
domestic:
  indices: ["sh000001", "sz399001", "sh000300"]
  banks: ["sh601939", "sh601288", "sh601988", "sh601398"]
  others: ["sz300059"]
  commodities: ["AU0", "AG0", "CU0"]
  oil: []
  sources:
    "sh000001": "akshare"
    "sz399001": "akshare"
    "sh000300": "akshare"
    "sh601939": "akshare"
    "sh601288": "akshare"
    "sh601988": "akshare"
    "sh601398": "akshare"
    "sz300059": "akshare"
  fallbacks: {}
  risk_free_rate:
    symbol: "CBY"
    default_value: 0.025

# --- Foreign Exchange (FX) ---
fx:
  pairs: ["USD/CNY", "EUR/CNY", "EUR/USD"]
  yfinance_symbols: ["USDCNY=X", "EURCNY=X", "EURUSD=X"]
  historical_priority: "yfinance" # Prioritize yfinance for historical FX accuracy

# --- Analysis Settings ---
analysis:
  frequency: "quarterly"
  period_label: "2026 Q1 Analysis"
  start_date: "2026-01-01"
  end_date: "2026-03-31"
  lookback_years: 3
  cache_dir: "cache"
  log_file: "logs/quant_system.log"

# --- API Settings ---
api:
  yfinance:
    timeout: 30
    retries: 3
  akshare:
    timeout: 60
    retries: 5
